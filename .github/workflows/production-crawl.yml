name: Job Pulse production crawl

# Keep the workflow revision visible in the Actions history after a runtime
# deployment so the first post-deploy drain is never mistaken for a stale run.

on:
  # Run once when the scheduler definition or its runner changes so a
  # production deployment cannot wait for the next two-hour tick. The
  # recurring schedule remains the source of normal operation.
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-crawl.yml
      - scripts/run-production-crawl.mjs
      - scripts/request-fallback-crawl.ts
      - scripts/browser-fallback-crawl.ts
      - lib/**
      - app/api/pulse/**
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: job-pulse-production-crawl
  # A newer repair commit must not wait behind a stale 20-minute drain. The
  # next run safely resumes leased sources after their bounded lease expires.
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  crawl:
    needs: request-recovery
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Drain due production sources
        env:
          JOB_PULSE_SITE_URL: https://job-pulse-realtime.autodev61.chatgpt.site
          JOB_PULSE_MAX_RUN_MINUTES: "20"
        run: node scripts/run-production-crawl.mjs

  request-recovery:
    # These exact sources expose validated first-party APIs that work from the
    # independent runner but reject Sites Worker egress. Recover them before
    # the native drain so its new next-crawl timestamp prevents a same-run
    # Worker-egress retry from overwriting the successful health result.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover request-only egress sources
        env:
          REQUEST_FALLBACK_LIVE_URL: https://job-pulse-realtime.autodev61.chatgpt.site
          REQUEST_FALLBACK_INGEST_URL: https://job-pulse-realtime.autodev61.chatgpt.site/api/pulse
          # Penn Medicine's official Talemetry map feed is available from the
          # independent runner but its edge rejects Sites Worker egress.
          REQUEST_FALLBACK_SOURCE_IDS: p5-0722-saic,p5-1039-revolut,p4-0241-cgi,p5-1018-penn-medicine,audit-row-342,legacy-row-826
        run: node scripts/request-fallback-crawl.ts

  browser-recovery:
    needs: [crawl, request-recovery]
    # Browser recovery is the safety net for exactly the runs where the
    # native drain encounters an infrastructure/OIDC failure.  Do not let a
    # failed native job suppress the independent browser queue.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # A transient registry/cache failure should not turn a scheduled
        # browser recovery into a false source outage. Keep the lockfile
        # authoritative, retry the normal install, then use npm's resolver
        # only as a recovery path for a stale runner cache.
        run: |
          npm ci --no-audit --no-fund --prefer-offline || \
            npm install --no-audit --no-fund --prefer-offline
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_factor: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "20000"
      - name: Recover browser-only problem sources
        env:
          BROWSER_FALLBACK_LIVE_URL: https://job-pulse-realtime.autodev61.chatgpt.site
          BROWSER_FALLBACK_INGEST_URL: https://job-pulse-realtime.autodev61.chatgpt.site/api/pulse
          # The browser action records every empty/failed/blocked result in
          # crawl_runs and advances next_crawl_at. Selecting the oldest rows
          # therefore rotates fairly without a run-number offset that could
          # skip sources as the queue shrinks.
          # The iframe-aware extractor can safely drain a larger slice while
          # staying below the 25-minute job timeout (4 browser workers).
          BROWSER_FALLBACK_LIMIT: "120"
          BROWSER_FALLBACK_CONCURRENCY: "4"
          # Delta's Avature listing is intentionally protected from Worker
          # egress and therefore must not sit behind the generic recovery
          # queue. The script still uses the official listing and verified
          # official job-detail URLs.
          BROWSER_FALLBACK_PRIORITY_SOURCE_IDS: audit-row-342
        run: npm run crawler:fallback:browser
