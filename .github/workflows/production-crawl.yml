name: Job Pulse production crawl

# Keep the workflow revision visible in the Actions history after a runtime
# deployment so the first post-deploy drain is never mistaken for a stale run.

on:
  # Run once when the scheduler definition or its runner changes so a
  # production deployment cannot wait for the next two-hour tick. The
  # recurring schedule remains the source of normal operation.
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-crawl.yml
      - scripts/run-production-crawl.mjs
      - scripts/request-fallback-crawl.ts
      - scripts/browser-fallback-crawl.ts
      - lib/**
      - app/api/pulse/**
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: job-pulse-production-crawl
  # A newer repair commit must not wait behind a stale 20-minute drain. The
  # next run safely resumes leased sources after their bounded lease expires.
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  crawl:
    needs: request-recovery
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Drain due production sources
        env:
          JOB_PULSE_SITE_URL: https://job-pulse-realtime.autodev61.chatgpt.site
          JOB_PULSE_MAX_RUN_MINUTES: "20"
        run: node scripts/run-production-crawl.mjs

  request-recovery:
    # These exact sources expose validated first-party APIs that work from the
    # independent runner but reject Sites Worker egress. Recover them before
    # the native drain so its new next-crawl timestamp prevents a same-run
    # Worker-egress retry from overwriting the successful health result.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover request-only egress sources
        env:
          REQUEST_FALLBACK_LIVE_URL: https://job-pulse-realtime.autodev61.chatgpt.site
          REQUEST_FALLBACK_INGEST_URL: https://job-pulse-realtime.autodev61.chatgpt.site/api/pulse
          # Penn Medicine's official Talemetry map feed is available from the
          # independent runner but its edge rejects Sites Worker egress.
          # SAIC's 1,000+ row reader catalog now crosses enough pages that a
          # single transient reader miss can fail the request-only job. Route
          # it through the browser recovery priority queue below, where the
          # native adapter gets a fresh independent attempt before Chrome.
          # Revolut now returns HTTP 403 to the request-only runner and is
          # recovered successfully by the browser job below. Keeping it here
          # made every otherwise-successful workflow conclude as failed.
          # Delta's Avature shell is likewise browser-only and already has a
          # dedicated priority slot in browser-recovery.
          # Jacobs Jobsyn rejects Sites Worker egress intermittently. Its
          # bounded catalog pass rotates by production slot on this runner.
          REQUEST_FALLBACK_SOURCE_IDS: p4-0241-cgi,p5-1018-penn-medicine,legacy-row-826,p2-0075-american-family-insurance,legacy-row-102
        run: node scripts/request-fallback-crawl.ts

  browser-recovery:
    needs: [crawl, request-recovery]
    # Browser recovery is the safety net for exactly the runs where the
    # native drain encounters an infrastructure/OIDC failure.  Do not let a
    # failed native job suppress the independent browser queue.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # A transient registry/cache failure should not turn a scheduled
        # browser recovery into a false source outage. Keep the lockfile
        # authoritative, retry the normal install, then use npm's resolver
        # only as a recovery path for a stale runner cache.
        run: |
          npm ci --no-audit --no-fund --prefer-offline || \
            npm install --no-audit --no-fund --prefer-offline
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_factor: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "20000"
      - name: Recover browser-only problem sources
        env:
          BROWSER_FALLBACK_LIVE_URL: https://job-pulse-realtime.autodev61.chatgpt.site
          BROWSER_FALLBACK_INGEST_URL: https://job-pulse-realtime.autodev61.chatgpt.site/api/pulse
          # The browser action records every empty/failed/blocked result in
          # crawl_runs and advances next_crawl_at. Selecting the oldest rows
          # therefore rotates fairly without a run-number offset that could
          # skip sources as the queue shrinks.
          # The iframe-aware extractor can safely drain a larger slice while
          # staying below the 25-minute job timeout (4 browser workers).
          BROWSER_FALLBACK_LIMIT: "120"
          BROWSER_FALLBACK_CONCURRENCY: "4"
          # Sources whose official boards require client rendering, protected
          # egress, or a browser-established session must not sit behind the
          # generic recovery queue. The script still validates the official
          # listing and direct job-detail URLs before ingesting any row.
          BROWSER_FALLBACK_PRIORITY_SOURCE_IDS: audit-row-342,audit-row-388,audit-row-399,legacy-row-118,legacy-row-782,legacy-row-794,legacy-row-835,p1-0008-protiviti,p2-0035-coinbase,p2-0036-evercore,p2-0045-logix-federal-cu,p2-0053-pcb-bank,p2-0058-royal-business-bank,p2-0153-prosperity-bancshares,p2-0167-state-attorneys-general,p2-0180-valley-national-bancorp,p2-0196-graphistry,p2-0198-senzing,p4-0251-credera,p4-0259-dow-jones-risk-compliance,p4-0287-gurucul,p4-0290-honor,p4-0302-l-e-k-consulting,p4-0317-nubank,p4-0336-ree-automotive,p4-0344-schr-dinger,p4-0384-veriff,p4-0385-west-monroe-los-angeles,p4-0386-whatnot,p4-0448-improving,p4-0481-realtor-com,p5-0616-hca-healthcare,p5-0623-ibis-ai,p5-0644-kratos-defense,p5-0645-kuka-us,p5-0722-saic,p5-0744-tabnine,p5-0747-teradata,p5-0755-tower-semiconductor,p5-0806-ase-group,p5-0810-atrium-health,p5-0857-closedloop,p5-0890-emory-healthcare,p5-0920-greyorange,p5-1017-pear-health-labs,p5-1039-revolut,p5-1077-tesla
          # These repaired first-party feeds are known to be complete through
          # the native adapter but can discriminate between Worker, Undici,
          # and HTTP/1.1 clients. Validate them every recovery run so a stale
          # healthy partial snapshot or a long failure backoff cannot hide a
          # data regression.
          BROWSER_FALLBACK_FORCE_NATIVE_SOURCE_IDS: legacy-row-118,legacy-row-835,legacy-row-876,p5-0699-pepsico,p2-0196-graphistry,p2-0058-royal-business-bank,p5-0810-atrium-health,p4-0236-cathay-bank,p4-0259-dow-jones-risk-compliance,p2-0035-coinbase,audit-row-350,p2-0036-evercore,p5-0931-henry-ford-health,p4-0290-honor,p5-0616-hca-healthcare,p5-0644-kratos-defense,p4-0302-l-e-k-consulting,p2-0044-loandepot,p4-0384-veriff,p4-0448-improving,p4-0458-mclagan,p4-0463-nardello-co,p5-1052-sarcos-robotics,p5-1039-revolut,p5-0722-saic,p5-0747-teradata,p5-0806-ase-group,p5-0857-closedloop,p5-0890-emory-healthcare,p2-0167-state-attorneys-general,legacy-row-867,p5-1077-tesla,p2-0179-us-attorney-s-office,p2-0180-valley-national-bancorp,p5-1104-wayfair,p4-0386-whatnot,audit-row-440,p5-0623-ibis-ai
        run: npm run crawler:fallback:browser
